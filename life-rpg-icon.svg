<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F1E"/>
      <stop offset="100%" stop-color="#080A14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E6BFF"/>
      <stop offset="55%" stop-color="#A45BFF"/>
      <stop offset="100%" stop-color="#FF3D9A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- pierscien dnia -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1A2039" stroke-width="34"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="245"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- litera L -->
  <path d="M212 176 L212 320 L306 320" fill="none" stroke="#EAF0FF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
